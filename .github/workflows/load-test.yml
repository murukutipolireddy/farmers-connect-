name: API Load Testing & Performance Benchmark

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/load-test.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  load-test:
    name: 100 Virtual Users Baseline Load Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm install --legacy-peer-deps

      - name: Start Backend Server
        working-directory: backend
        run: |
          npm run dev &
          sleep 4
          curl -s http://localhost:4029/api/health || exit 1

      - name: Execute 1-Minute 100-User Baseline Load Test & Excel Generator
        run: |
          node backend/scripts/run60sLoadTestAndGenerateExcel.js

      - name: Setup k6 (Optional Benchmark)
        uses: grafana/setup-k6-action@v1
        continue-on-error: true

      - name: Run k6 Baseline Suite
        continue-on-error: true
        run: |
          k6 run --summary-export=summary.json backend/scripts/load-test.js
        env:
          BACKEND_URL: 'http://localhost:4029'

      - name: Parse & Publish Load Test Summary
        continue-on-error: true
        run: |
          node backend/scripts/parseK6Summary.js
        env:
          GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}

      - name: Upload Load Test & Excel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agrimart-load-test-artifacts
          path: |
            agrimart-load-test-report.xlsx
            agrimart-load-test-results.csv
            summary.json
            load-test-summary.md
