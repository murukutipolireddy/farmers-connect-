name: API Load Testing & Performance Benchmark

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/load-test.yml'
  pull_request:
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  load-test:
    name: 100 Virtual Users Baseline Load Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Start Backend Server
        working-directory: backend
        run: |
          npm run dev &
          sleep 4
          curl -s http://localhost:4029/api/health || exit 1

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Execute 100 VUs Load Test (1 Minute)
        run: |
          k6 run --summary-export=summary.json backend/scripts/load-test.js
        env:
          BACKEND_URL: 'http://localhost:4029'

      - name: Parse & Publish Load Test Summary
        run: |
          node backend/scripts/parseK6Summary.js
        env:
          GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}

      - name: Upload Load Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: |
            summary.json
            load-test-summary.md
